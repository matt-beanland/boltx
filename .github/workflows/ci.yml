name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.2'
          elixir-version: '1.20.2'

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-'1.20.2'-'29.0.2'-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      - run: mix deps.compile
      - name: Check Code Formatting
        run: mix format --check-formatted
      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors
      - name: Dialyzer
        run: mix dialyzer --format github
  test:
    name: BoltVersion ${{ matrix.boltVersion }}, DB ${{matrix.db}}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Pure include-list: each entry is one job, so the same Bolt version can run
        # against two servers (e.g. 5.8 vs the LTS and vs the Bolt-6 server) without
        # the matrix key colliding. mixTestPartition just uniquely names each job's
        # coverage artifact.
        include:
          # Bolt 5.x against the Neo4j 5.26.27 LTS.
          - boltVersion: '5.0'
            db: neo4j:5.26.27-community
            mixTestPartition: 1
          - boltVersion: '5.1'
            db: neo4j:5.26.27-community
            mixTestPartition: 2
          - boltVersion: '5.2'
            db: neo4j:5.26.27-community
            mixTestPartition: 3
          - boltVersion: '5.3'
            db: neo4j:5.26.27-community
            mixTestPartition: 4
          - boltVersion: '5.4'
            db: neo4j:5.26.27-community
            mixTestPartition: 5
          - boltVersion: '5.6'
            db: neo4j:5.26.27-community
            mixTestPartition: 6
          - boltVersion: '5.7'
            db: neo4j:5.26.27-community
            mixTestPartition: 7
          - boltVersion: '5.8'
            db: neo4j:5.26.27-community
            mixTestPartition: 8
          # Bolt 6.0 against Neo4j 2026.05.
          - boltVersion: '6.0'
            db: neo4j:2026.05-community
            mixTestPartition: 9
          # Bolt 5.x fallback against the Bolt-6 server (2026.05): a 5.x-constrained
          # client must still negotiate and run against a newer server. Cover the
          # negotiation floor (5.0) and ceiling (5.8).
          - boltVersion: '5.8'
            db: neo4j:2026.05-community
            mixTestPartition: 10
          - boltVersion: '5.0'
            db: neo4j:2026.05-community
            mixTestPartition: 11
    env:
      MIX_ENV: test
      BOLT_VERSIONS: ${{matrix.boltVersion}}
      BOLT_TCP_PORT: 7687
      MIX_TEST_PARTITION: 1
      TEST_PARTITION_NUMBER: ${{ matrix.mixTestPartition }}
      RUN_ID: ${{github.run_id}}
    steps:
      - run: docker run -p 7687:7687 -e NEO4J_AUTH=neo4j/password -e NEO4J_dbms_connector_bolt_listen__address=:7687 --detach ${{matrix.db}}
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.2'
          elixir-version: '1.20.2'

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-'1.20.2'-'29.0.2'-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      - run: mix deps.compile
      - name: Run Test Script
        run: |
          mix test --cover --partitions 1 --export-coverage coverdata-${RUN_ID}-${TEST_PARTITION_NUMBER}
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: coverdata-${{ github.run_id }}-${{matrix.mixTestPartition}}
          path: cover
          retention-days: 1
  tls:
    name: TLS verification (bolt+s / bolt+ssc)
    runs-on: ubuntu-latest
    needs: lint
    env:
      MIX_ENV: test
      BOLT_TCP_PORT: 7687
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build a TLS-enabled Neo4j whose server cert is signed by a throwaway CA,
      # then run the :tls suite (excluded by default) against it. Guards #69's
      # certificate handling end-to-end, which the unit tests can't observe.
      - name: Generate TLS test certs
        run: ./test/tls/gen_certs.sh

      - name: Build TLS-enabled Neo4j image
        run: docker build -t bolty-neo4j-tls test/tls

      - name: Start Neo4j (TLS)
        run: |
          docker run --name neo4j-tls -p 7687:7687 \
            -e NEO4J_AUTH=neo4j/password \
            -e NEO4J_dbms_connector_bolt_listen__address=:7687 \
            --detach bolty-neo4j-tls

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.2'
          elixir-version: '1.20.2'

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-'1.20.2'-'29.0.2'-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      - run: mix deps.compile

      - name: Wait for Neo4j to be ready
        run: |
          for i in $(seq 1 60); do
            if docker exec neo4j-tls cypher-shell -u neo4j -p password 'RETURN 1' >/dev/null 2>&1; then
              echo "Neo4j is ready"; exit 0
            fi
            sleep 3
          done
          echo "Neo4j did not become ready in time"; docker logs neo4j-tls; exit 1

      - name: Run TLS tests
        run: mix test --include tls test/bolty/tls_test.exs
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
            otp-version: '29.0.2'
            elixir-version: '1.20.2'

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-'1.20.2'-'29.0.2'-${{ hashFiles('**/mix.lock') }}

      - uses: actions/download-artifact@v4
        with:
          path: cover
          pattern: coverdata-${{ github.run_id }}-*
          merge-multiple: true
      - run: mix test.coverage
