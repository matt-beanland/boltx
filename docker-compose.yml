version: "3.0"

services:
  neo4j-2026.05:
    image: neo4j:2026.05.0-community-ubi10
    labels:
        - "boltVersions=6.0"
        - "database=neo4j"
    ports:
      - 7689:7687
    environment:
      - NEO4J_AUTH=neo4j/password
  neo4j-5.26.27:
    image: neo4j:5.26.27-community
    labels:
        - "boltVersions=5.0,5.1,5.2,5.3,5.4,5.6,5.7,5.8"
        - "database=neo4j"
    ports:
      - 7690:7687
    environment:
      - NEO4J_AUTH=neo4j/password
